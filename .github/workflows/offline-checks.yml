name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Test the development request boundary
        run: python -m unittest discover -s starter -v
      - name: Validate the fixed development profile
        run: python starter/harness_client.py validate
      - name: Validate AWS template shapes locally
        run: python scripts/verify_blueprints.py
